# Optional. Copy to ~/.router_controller_config.yaml to override any default.

target_network: "1_lemonlemon_1"   # Wi-Fi name that counts as "on the router's network" (any wired connection also counts)
router_url: "https://routerlogin.net/"
service_name: "router_admin"       # Keychain service holding the admin username and password
timeout: 10                        # seconds to wait for router pages
headless: true                     # hide Chrome during on/off (the menu bar app always passes --headless)
enable_notifications: false        # macOS notification after on/off
